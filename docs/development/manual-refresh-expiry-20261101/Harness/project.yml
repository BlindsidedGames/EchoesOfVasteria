name: EchoesManualExpiryQA
options:
  deploymentTarget:
    iOS: "16.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: ""
targets:
  EchoesManualExpiryQA:
    type: application
    platform: iOS
    sources:
      - Host.swift
      - snapshot.json
      - Assets.xcassets
      - ../../../../Assets/Editor/iOSLiveActivity/Native/EOVForecastAttributes.swift
      - ../../../../Assets/Editor/iOSLiveActivity/Native/EOVBackgroundAllowance.swift
      - ../../../../Assets/Editor/iOSLiveActivity/Native/EOVRefreshIntent.swift
      - ../../../../Assets/Editor/iOSLiveActivity/Native/EOVLiveActivityBridge.swift
      - ../../../../Assets/Editor/iOSLiveActivity/Companion/EOVWatchSnapshot.swift
      - ../../../../Assets/Editor/iOSLiveActivity/Companion/EOVWatchPhoneSession.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blindsidedgames.echoes.manualexpiryqa
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_FILE: HostInfo.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) EOV_LIVE_ACTIVITY_HOST
    dependencies:
      - target: EchoesManualExpiryQAWidget
        embed: true
      - target: EOVTransportQA
        embed: true
      - target: EchoesManualExpiryWatchQA
        embed: true
  EchoesManualExpiryWatchQA:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: ../../../../Assets/Editor/iOSLiveActivity/Companion
        excludes: [EOVWatchPhoneSession.swift, Art, "*.meta"]
      - ../../../../Assets/Editor/iOSLiveActivity/Native/EOVBackgroundAllowance.swift
      - path: ../../../../Artifacts/WatchIntegration/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blindsidedgames.echoes.manualexpiryqa.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: NO
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.blindsidedgames.echoes.manualexpiryqa
        INFOPLIST_KEY_CFBundleDisplayName: Echoes Paired QA
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SKIP_INSTALL: YES
  EOVTransportQA:
    type: framework
    platform: iOS
    sources:
      - ../../../../Assets/Editor/iOSLiveActivity/Native/EOVLiveActivity.mm
      - ../../../../Assets/Editor/iOSLiveActivity/Companion/EOVWatchSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blindsidedgames.echoes.manualexpiryqa.transport
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
    dependencies:
      - sdk: UIKit.framework
  EchoesManualExpiryQAWidget:
    type: app-extension
    platform: iOS
    sources:
      - Assets.xcassets
      - ../../../../Assets/Editor/iOSLiveActivity/Native/EOVForecastAttributes.swift
      - ../../../../Assets/Editor/iOSLiveActivity/Native/EOVBackgroundAllowance.swift
      - ../../../../Assets/Editor/iOSLiveActivity/Native/EOVRefreshIntent.swift
      - ../../../../Assets/Editor/iOSLiveActivity/Templates/EOVForecastWidget.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blindsidedgames.echoes.manualexpiryqa.widget
        INFOPLIST_FILE: WidgetInfo.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  EchoesManualExpiryQA:
    build:
      targets:
        EchoesManualExpiryQA: all
