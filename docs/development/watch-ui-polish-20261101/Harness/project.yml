name: EchoesUIPolish
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: ""
targets:
  EchoesUIPolish:
    type: application
    platform: iOS
    sources:
      - Host.swift
      - snapshot.json
      - Assets.xcassets
      - ../../../../Assets/Editor/iOSLiveActivity/Native/EOVForecastAttributes.swift
      - ../../../../Assets/Editor/iOSLiveActivity/Native/EOVRefreshIntent.swift
      - ../../../../Assets/Editor/iOSLiveActivity/Native/EOVLiveActivityBridge.swift
      - ../../../../Assets/Editor/iOSLiveActivity/Companion/EOVWatchSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blindsidedgames.echoes.uipolish
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_FILE: HostInfo.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) EOV_LIVE_ACTIVITY_HOST
    dependencies:
      - target: EchoesUIPolishWidget
        embed: true
  EchoesUIPolishWidget:
    type: app-extension
    platform: iOS
    sources:
      - Assets.xcassets
      - ../../../../Assets/Editor/iOSLiveActivity/Native/EOVForecastAttributes.swift
      - ../../../../Assets/Editor/iOSLiveActivity/Native/EOVRefreshIntent.swift
      - ../../../../Assets/Editor/iOSLiveActivity/Templates/EOVForecastWidget.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blindsidedgames.echoes.uipolish.widget
        INFOPLIST_FILE: WidgetInfo.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  EchoesUIPolish:
    build:
      targets:
        EchoesUIPolish: all
